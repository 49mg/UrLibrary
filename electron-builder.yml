appId: com.urlibrary.app
productName: Ur Library
copyright: Copyright © 2026 mgdhia
directories:
  buildResources: build
  output: dist
files:
  # Only the built app and production dependencies are shipped.
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
  # glibc distros (Ubuntu, Debian, Fedora…) only load the gnu build of the canvas binary.
  - '!node_modules/@napi-rs/canvas-linux-x64-musl/**'
asarUnpack:
  - resources/**
  # Native canvas binary and Tesseract's worker scripts must be real files on disk.
  - node_modules/@napi-rs/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
npmRebuild: false
# Releases (and auto-updates) come from GitHub Releases of this repository.
publish:
  provider: github
  owner: 49mg
  repo: UrLibrary
win:
  executableName: ur-library
  target: nsis
nsis:
  artifactName: ur-library-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.books
  entitlementsInherit: build/entitlements.mac.plist
  target: dmg
  notarize: false
dmg:
  artifactName: ur-library-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: ur-library
  maintainer: mgdhia <mgdhia49@gmail.com>
  vendor: mgdhia
  synopsis: Read, annotate and transform your books with AI
  description: >-
    Ur Library (مكتبة اور) finds and downloads free public-domain books, reads PDF, EPUB and Word files,
    keeps highlights and notes, and uses Claude (with your own API key) to summarize, simplify,
    translate or answer questions about a book.
  category: Office
  desktop:
    entry:
      Name: Ur Library
      Name[ar]: مكتبة اور
      GenericName: E-book Reader
      GenericName[ar]: قارئ كتب إلكترونية
      Comment: Read, annotate and transform your books with AI
      Comment[ar]: اقرأ كتبك ودوّن ملاحظاتك عليها وحوّلها بالذكاء الاصطناعي
      Keywords: books;ebook;reader;pdf;epub;library;notes;highlights;ur;كتب;مكتبة;
      StartupWMClass: ur-library
appImage:
  artifactName: ur-library-${version}.${ext}
deb:
  packageName: ur-library
  artifactName: ur-library_${version}_${arch}.${ext}
  # Keyring access (libsecret) for storing the API key encrypted.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
